name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: volum-macos
          add-job-id-key: false
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  linux-bundle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            xdg-utils \
            xvfb
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: volum-linux
          add-job-id-key: false
      - run: npm ci
      - name: Build AppImage
        run: npm run tauri build -- --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Inspect AppImage and AUR renderer
        run: |
          set -euo pipefail
          APPIMAGE="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"
          mkdir appimage-inspection
          cd appimage-inspection
          "../$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -n "$(find squashfs-root -type f -name '*.desktop' -print -quit)"
          set +e
          timeout 20s xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            squashfs-root/AppRun > appimage-smoke.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 124 ]; then
            cat appimage-smoke.log
            exit 1
          fi
          cd ..
          python3 packaging/aur/render.py \
            --version 0.0.0 \
            --appimage-sha256 "$(sha256sum "$APPIMAGE" | cut -d' ' -f1)" \
            --output "$RUNNER_TEMP/volum-aur"
          test -f "$RUNNER_TEMP/volum-aur/PKGBUILD"

  windows-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            expected-machine: "0x8664"
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            expected-machine: "0xAA64"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: volum-windows-${{ matrix.target }}
          add-job-id-key: false
      - run: npm ci
      - name: Build Windows installer
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Inspect Windows app architecture and installer
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_MACHINE: ${{ matrix.expected-machine }}
        run: |
          $ErrorActionPreference = "Stop"
          $app = Get-Item "src-tauri/target/$env:TARGET/release/volum.exe"
          $installer = Get-ChildItem "src-tauri/target/$env:TARGET/release/bundle/nsis" -File -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -eq 0) {
            throw "Windows NSIS installer was not created"
          }

          $bytes = [System.IO.File]::ReadAllBytes($app.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $expected = [Convert]::ToUInt16($env:EXPECTED_MACHINE.Substring(2), 16)
          if ($machine -ne $expected) {
            throw "Unexpected PE machine 0x$($machine.ToString('X4')); expected 0x$($expected.ToString('X4'))"
          }
