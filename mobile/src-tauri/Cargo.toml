[package]
name = "volum-companion"
version = "0.1.0"
description = "Volum Companion for iOS and Android"
authors = ["Volum contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "volum_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-stronghold = "2.4.0"
tauri-plugin-barcode-scanner = "2.5.3"
tauri-plugin-dialog = "2.4.0"
tauri-plugin-fs = "2.5.2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rand = "0.9"
base64 = "0.22"
tokio = { version = "1", features = ["fs", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.dev.package.scrypt]
opt-level = 3
