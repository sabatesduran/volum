[package]
name = "volum"
version = "0.2.0"
description = "A beautiful home for your 3D projects"
authors = ["Volum contributors"]
edition = "2021"
license = "GPL-3.0-or-later"
default-run = "volum"

[lib]
name = "volum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-fs = "2"
tauri-plugin-log = "2.7.0"
tauri-plugin-single-instance = "2.3.4"
tauri-plugin-window-state = "2.4.0"
tauri-plugin-process = "2"
tauri-plugin-updater = "2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "migrate", "uuid"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros", "net", "io-util", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
notify = "8"
blake3 = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
open = "5"
log = "0.4"
thiserror = "2"
regex = "1"
reqwest = { version = "0.13", features = ["brotli", "deflate", "gzip", "query", "stream"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust", "vendored"] }
percent-encoding = "2"
trash = "5"
axum = "0.8"
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["fs", "timeout"] }
base64 = "0.22"
rand = "0.9"
futures-util = "0.3"
argon2 = "0.5"
fs2 = "0.4"

[target.'cfg(not(all(target_os = "windows", target_arch = "aarch64")))'.dependencies]
cadrum = { version = "0.8.20", default-features = false }

[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
cadrum = { version = "0.8.20", default-features = false, features = ["source"] }

[dev-dependencies]
tempfile = "3"
