[package]
name = "volum-companion"
version = "1.0.0"
description = "Volum Companion for iOS and Android"
authors = ["Volum contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "volum_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri = { workspace = true, features = ["wry"] }
tauri-plugin-barcode-scanner = "2.5.3"
tauri-plugin-dialog = "2.4.0"
tauri-plugin-fs = "2.5.2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-stronghold = "2.4.0"
tauri-plugin-app-locale = { path = "../../../crates/tauri-plugin-app-locale", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
rand.workspace = true
base64.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
ring = "0.17.14"

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
