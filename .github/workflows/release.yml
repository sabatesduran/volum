name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            xdg-utils \
            xvfb
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: volum-linux
          add-job-id-key: false
      - run: npm ci
      - name: Build signed AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --bundles appimage
      - name: Prepare and inspect Linux artifacts
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          BUNDLE_DIR="src-tauri/target/release/bundle/appimage"
          APPIMAGE="$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          SIGNATURE="$APPIMAGE.sig"

          test -n "$APPIMAGE"
          test -s "$SIGNATURE"
          mkdir -p release appimage-inspection
          install -m755 "$APPIMAGE" release/Volum_linux_x86_64.AppImage
          cp "$SIGNATURE" release/Volum_linux_x86_64.AppImage.sig
          (
            cd release
            sha256sum Volum_linux_x86_64.AppImage \
              > Volum_linux_x86_64.AppImage.sha256
          )

          cd appimage-inspection
          ../release/Volum_linux_x86_64.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -n "$(find squashfs-root -type f -name '*.desktop' -print -quit)"
          test -n "$(find squashfs-root -type f -name volum -print -quit)"
          set +e
          timeout 20s xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            squashfs-root/AppRun > appimage-smoke.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 124 ]; then
            cat appimage-smoke.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: volum-linux-x86_64
          path: release/*
          if-no-files-found: error
          retention-days: 7

  windows-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset-arch: x86_64
            expected-machine: "0x8664"
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset-arch: arm64
            expected-machine: "0xAA64"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: volum-windows-${{ matrix.target }}
          add-job-id-key: false
      - run: npm ci
      - name: Build signed Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles nsis
      - name: Prepare and inspect Windows artifacts
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ASSET_ARCH: ${{ matrix.asset-arch }}
          EXPECTED_MACHINE: ${{ matrix.expected-machine }}
        run: |
          $ErrorActionPreference = "Stop"
          $app = Get-Item "src-tauri/target/$env:TARGET/release/volum.exe"
          $installer = Get-ChildItem "src-tauri/target/$env:TARGET/release/bundle/nsis" -File -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -eq 0) {
            throw "Windows NSIS installer was not created"
          }
          $signature = Get-Item "$($installer.FullName).sig"
          if ($signature.Length -eq 0) {
            throw "Windows updater signature was not created"
          }

          $bytes = [System.IO.File]::ReadAllBytes($app.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $expected = [Convert]::ToUInt16($env:EXPECTED_MACHINE.Substring(2), 16)
          if ($machine -ne $expected) {
            throw "Unexpected PE machine 0x$($machine.ToString('X4')); expected 0x$($expected.ToString('X4'))"
          }

          New-Item -ItemType Directory -Force -Path release | Out-Null
          $destination = "release/Volum_windows_$($env:ASSET_ARCH)_setup.exe"
          Copy-Item $installer.FullName $destination
          Copy-Item $signature.FullName "$destination.sig"
          $hash = (Get-FileHash -Algorithm SHA256 $destination).Hash.ToLowerInvariant()
          $checksum = "$hash  $([System.IO.Path]::GetFileName($destination))`n"
          [System.IO.File]::WriteAllText("$destination.sha256", $checksum, [System.Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: volum-windows-${{ matrix.asset-arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: volum-macos
          add-job-id-key: false
      - run: npm ci
      - name: Prepare Apple API key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          export APPLE_API_KEY_PATH
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["APPLE_API_KEY_PATH"]).write_bytes(
              base64.b64decode(os.environ["APPLE_API_KEY_B64"])
          )
          PY
          chmod 600 "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Volum v__VERSION__
          releaseBody: |
            Volum for macOS, Linux, and Windows, with a visual, local-first home for your 3D-printing library.

            - Visual, local-first model library
            - STL, OBJ, and rich multi-plate 3MF previews
            - Search, collections, tags, duplicates, materials, and cost estimates
            - MakerWorld and Printables attribution imports
            - ZIP archives are ignored instead of appearing as models
            - English, Catalan, and European Spanish interfaces
            - Automatic signed update checks with approval before download and restart
            - Signed with Developer ID and notarized by Apple for a smooth installation
            - Linux x86_64 AppImage and Arch Linux package
            - Native Windows x64 and ARM64 installers

            Windows 11 ARM64 was validated with native ARM64 Volum and OrcaSlicer builds, plus x64 Volum and PrusaSlicer through Windows emulation. Windows installers are not yet Authenticode-signed, so Microsoft Defender SmartScreen may show a warning on first install. In-app update packages are signed and verified by Volum.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin
      - name: Notarize DMG and verify distribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          TAG="v$VERSION"
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle"
          APP="$BUNDLE_DIR/macos/Volum.app"
          DMG="$BUNDLE_DIR/dmg/Volum_${VERSION}_universal.dmg"

          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 1h
          xcrun stapler staple "$DMG"

          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --verbose=3 --type execute "$APP"
          codesign --verify --strict --verbose=2 "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --verbose=3 --type open --context context:primary-signature "$DMG"

          gh release upload "$TAG" "$DMG" --clobber

  publish-platforms:
    needs: [publish, linux-appimage, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: volum-linux-x86_64
          path: release
      - uses: actions/download-artifact@v5
        with:
          pattern: volum-windows-*
          path: release
          merge-multiple: true
      - name: Upload platform artifacts and extend updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          TAG="v$VERSION"
          (
            cd release
            sha256sum -c Volum_linux_x86_64.AppImage.sha256
            sha256sum -c Volum_windows_x86_64_setup.exe.sha256
            sha256sum -c Volum_windows_arm64_setup.exe.sha256
          )
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            release/Volum_linux_x86_64.AppImage \
            release/Volum_linux_x86_64.AppImage.sig \
            release/Volum_linux_x86_64.AppImage.sha256 \
            release/Volum_windows_x86_64_setup.exe \
            release/Volum_windows_x86_64_setup.exe.sig \
            release/Volum_windows_x86_64_setup.exe.sha256 \
            release/Volum_windows_arm64_setup.exe \
            release/Volum_windows_arm64_setup.exe.sig \
            release/Volum_windows_arm64_setup.exe.sha256 \
            --clobber

          mkdir updater
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir updater
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          jq \
            --arg linux_url "$RELEASE_URL/Volum_linux_x86_64.AppImage" \
            --arg windows_x86_64_url "$RELEASE_URL/Volum_windows_x86_64_setup.exe" \
            --arg windows_aarch64_url "$RELEASE_URL/Volum_windows_arm64_setup.exe" \
            --rawfile linux_signature release/Volum_linux_x86_64.AppImage.sig \
            --rawfile windows_x86_64_signature release/Volum_windows_x86_64_setup.exe.sig \
            --rawfile windows_aarch64_signature release/Volum_windows_arm64_setup.exe.sig \
            '.platforms["linux-x86_64"] = {url: $linux_url, signature: ($linux_signature | rtrimstr("\n"))}
             | .platforms["windows-x86_64"] = {url: $windows_x86_64_url, signature: ($windows_x86_64_signature | rtrimstr("\n"))}
             | .platforms["windows-aarch64"] = {url: $windows_aarch64_url, signature: ($windows_aarch64_signature | rtrimstr("\n"))}' \
            updater/latest.json > updater/latest-platforms.json
          mv updater/latest-platforms.json updater/latest.json
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" updater/latest.json --clobber

  publish-arch:
    needs: [publish-platforms, linux-appimage]
    runs-on: ubuntu-latest
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: volum-linux-x86_64
          path: release
      - name: Render and validate volum-bin
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          APPIMAGE_SHA256="$(sha256sum release/Volum_linux_x86_64.AppImage | cut -d' ' -f1)"
          PACKAGE_DIR="$RUNNER_TEMP/volum-bin"
          python3 packaging/aur/render.py \
            --version "$VERSION" \
            --appimage-sha256 "$APPIMAGE_SHA256" \
            --output "$PACKAGE_DIR"

          docker run --rm \
            -v "$PACKAGE_DIR:/pkg" \
            archlinux:base-devel \
            bash -euc '
              useradd --create-home builder
              chown -R builder:builder /pkg
              su builder -c "cd /pkg && makepkg --noconfirm --nodeps"
              su builder -c "cd /pkg && makepkg --printsrcinfo > .SRCINFO"
            '

          ARCH_PACKAGE="$(find "$PACKAGE_DIR" -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)"
          test -n "$ARCH_PACKAGE"
          cp "$ARCH_PACKAGE" "release/volum-bin-${VERSION}-1-x86_64.pkg.tar.zst"
          tar -czf "release/volum-bin-${VERSION}-aur.tar.gz" \
            -C "$PACKAGE_DIR" PKGBUILD .SRCINFO volum.desktop volum.png
      - name: Upload Arch Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            release/volum-bin-*.pkg.tar.zst \
            release/volum-bin-*-aur.tar.gz \
            --clobber
      - name: Publish to the AUR
        if: ${{ env.AUR_SSH_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          install -d -m700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur_volum"
          chmod 600 "$HOME/.ssh/aur_volum"
          ssh-keyscan -t ed25519 aur.archlinux.org > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_volum
            IdentitiesOnly yes
          EOF
          chmod 600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"

          AUR_REPOSITORY="$RUNNER_TEMP/aur-volum-bin"
          git clone ssh://aur@aur.archlinux.org/volum-bin.git "$AUR_REPOSITORY"
          cp "$RUNNER_TEMP/volum-bin/PKGBUILD" "$AUR_REPOSITORY/PKGBUILD"
          cp "$RUNNER_TEMP/volum-bin/.SRCINFO" "$AUR_REPOSITORY/.SRCINFO"
          cp "$RUNNER_TEMP/volum-bin/volum.desktop" "$AUR_REPOSITORY/volum.desktop"
          cp "$RUNNER_TEMP/volum-bin/volum.png" "$AUR_REPOSITORY/volum.png"
          git -C "$AUR_REPOSITORY" config user.name "Volum release automation"
          git -C "$AUR_REPOSITORY" config user.email "actions@users.noreply.github.com"
          git -C "$AUR_REPOSITORY" add PKGBUILD .SRCINFO volum.desktop volum.png
          if ! git -C "$AUR_REPOSITORY" diff --cached --quiet; then
            VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
            git -C "$AUR_REPOSITORY" commit -m "Update to $VERSION"
            git -C "$AUR_REPOSITORY" push origin master
          fi
