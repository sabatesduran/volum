[package]
name = "volum"
version = "0.1.1"
description = "A beautiful home for your 3D models"
authors = ["Volum contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "volum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
tauri-plugin-dialog = "2.4.0"
tauri-plugin-log = "2.7.0"
tauri-plugin-single-instance = "2.3.4"
tauri-plugin-window-state = "2.4.0"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "migrate", "uuid"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
notify = "8"
blake3 = "1"
zip = { version = "5", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
log = "0.4"
thiserror = "2"
regex = "1"
reqwest = { version = "0.13", features = ["brotli", "deflate", "gzip", "query"] }

[dev-dependencies]
tempfile = "3"
