steps:
  - launch: com.dsd.volum.companion
  - tool: await-ui-element
    args:
      condition: visible
      selector: { role: Button }
      bundleId: com.dsd.volum.companion
      timeoutMs: 8000
  - wait: 500
  - tool: gesture-tap
    args: { x: 0.5, y: 0.875 }
  - tool: await-ui-element
    args:
      condition: visible
      selector: { text: 3DBenchy Calibration Boat }
      bundleId: com.dsd.volum.companion
      timeoutMs: 8000
  - wait: 500
  - tool: gesture-tap
    args: { x: 0.25, y: 0.35 }
  - wait: 1800
