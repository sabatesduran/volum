name: CI

on:
  push:
  pull_request:

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint GitHub Actions workflows
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro"
          --workdir /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan Git history for secrets
        run: >-
          "$RUNNER_TEMP/gitleaks" git .
          --no-banner
          --redact=100
          --max-decode-depth=2
          --max-archive-depth=1
          --verbose

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run budget

  shared-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [companion-api, shared, viewer]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run generate:check
        if: matrix.package == 'companion-api'
      - run: npm test

  photo-room:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/photo-room
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: packages/photo-room/package-lock.json
      - run: npm ci
      - run: npm test

  server-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server-admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: apps/server-admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run budget

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci
      - run: npm run build

  server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose configuration
        env:
          VOLUM_PUBLIC_URL: http://100.64.0.1:43821
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build volumd image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: volum-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test headless runtime
        run: |
          set -euo pipefail
          cleanup() { docker rm --force volum-server-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name volum-server-ci \
            --read-only \
            --tmpfs /tmp:size=256m,mode=1777 \
            --tmpfs /config:size=256m,uid=1000,gid=1000 \
            --tmpfs /library:size=256m,uid=1000,gid=1000 \
            --publish 127.0.0.1:43829:43821 \
            --env VOLUM_PUBLIC_URL=http://127.0.0.1:43829 \
            volum-server:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:43829/readyz >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs volum-server-ci; exit 1; fi
            sleep 1
          done
          test "$(curl --fail --silent http://127.0.0.1:43829/healthz)" = "ok"
          curl --fail --silent http://127.0.0.1:43829/ | grep --quiet '<title>Volum server</title>'
      - name: Generate container SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: volum-server:ci
          format: cyclonedx-json
          output-file: volum-server.cdx.json
          artifact-name: volum-server-sbom

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
      - name: Audit JavaScript lockfiles
        run: |
          set -euo pipefail
          for package in \
            apps/desktop \
            apps/mobile \
            apps/server-admin \
            apps/website \
            packages/companion-api \
            packages/photo-room \
            packages/shared \
            packages/viewer; do
            npm audit --prefix "$package" --audit-level=high
          done
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check advisories bans licenses sources

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: volum-macos
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  headless-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: volum-headless-linux
      - run: cargo clippy -p volum-server -p volumd --all-targets --no-default-features -- -D warnings
      - run: cargo test -p volum-server --no-default-features
      - name: Assert volumd has no GUI runtime
        run: |
          set -euo pipefail
          if cargo tree -p volumd -e normal | grep -Ei '(tauri|wry|webkit|gtk|keyring|dbus|zbus|secret-service)'; then
            echo "volumd unexpectedly depends on a desktop or credential-store runtime"
            exit 1
          fi

  linux-bundle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            xdg-utils \
            xvfb
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: volum-linux
      - run: npm ci --prefix apps/desktop
      - name: Build AppImage
        run: npm --prefix apps/desktop run tauri -- build --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Inspect AppImage and AUR renderer
        run: |
          set -euo pipefail
          APPIMAGE="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          chmod +x "$APPIMAGE"
          mkdir appimage-inspection
          cd appimage-inspection
          "../$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -n "$(find squashfs-root -type f -name '*.desktop' -print -quit)"
          set +e
          timeout 20s xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            squashfs-root/AppRun > appimage-smoke.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 124 ]; then
            cat appimage-smoke.log
            exit 1
          fi
          cd ..
          python3 packaging/aur/render.py \
            --version 0.0.0 \
            --appimage-sha256 "$(sha256sum "$APPIMAGE" | cut -d' ' -f1)" \
            --output "$RUNNER_TEMP/volum-aur"
          test -f "$RUNNER_TEMP/volum-aur/PKGBUILD"

  windows-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            expected-machine: "0x8664"
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            expected-machine: "0xAA64"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: volum-windows-${{ matrix.target }}
      - run: npm ci --prefix apps/desktop
      - name: Build Windows installer
        run: npm --prefix apps/desktop run tauri -- build --target ${{ matrix.target }} --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Inspect Windows app architecture and installer
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_MACHINE: ${{ matrix.expected-machine }}
        run: |
          $ErrorActionPreference = "Stop"
          $app = Get-Item "target/$env:TARGET/release/volum.exe"
          $installer = Get-ChildItem "target/$env:TARGET/release/bundle/nsis" -File -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -eq 0) {
            throw "Windows NSIS installer was not created"
          }

          $bytes = [System.IO.File]::ReadAllBytes($app.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $expected = [Convert]::ToUInt16($env:EXPECTED_MACHINE.Substring(2), 16)
          if ($machine -ne $expected) {
            throw "Unexpected PE machine 0x$($machine.ToString('X4')); expected 0x$($expected.ToString('X4'))"
          }
