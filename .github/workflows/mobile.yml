name: Mobile

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "crates/tauri-plugin-app-locale/**"
      - "packages/companion-api/**"
      - "packages/design/**"
      - "packages/photo-room/**"
      - "packages/shared/**"
      - "packages/viewer/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".nvmrc"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "crates/tauri-plugin-app-locale/**"
      - "packages/companion-api/**"
      - "packages/design/**"
      - "packages/photo-room/**"
      - "packages/shared/**"
      - "packages/viewer/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".nvmrc"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run budget

  visual:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mobile-visual-diff
          path: apps/mobile/test-results
          if-no-files-found: ignore

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p volum-companion --all-targets -- -D warnings
      - run: cargo test -p volum-companion

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;28.2.13676358"
      - run: npm ci
      - run: npm run tauri -- android build --target aarch64 --apk
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - name: Build iOS simulator app without signing
        run: npm run tauri -- ios build --debug --target aarch64-sim --ci --no-sign --archive-only
